<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Guitar Trainer</title>
  <style>
    :root {
      --bg-color: #1a1a1a;
      --card-bg: #2a2a2a;
      --accent: #ff9800;
      --text: #ffffff;
      --fretboard-wood: #3e2723;
      --fret-wire: #b0bec5;
      --string-color: #e0e0e0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      max-width: 800px;
      width: 100%;
      background: var(--card-bg);
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    h1 {
      text-align: center;
      margin-top: 0;
      color: var(--accent);
    }

    .chord-selector {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    button {
      background: #444;
      color: white;
      border: 2px solid transparent;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      transition: all 0.2s;
    }

    button:hover {
      background: #555;
    }

    button.active {
      background: var(--accent);
      color: #000;
      border-color: #fff;
    }

    .info-panel {
      background: #111;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      border-left: 4px solid var(--accent);
    }

    .fretboard-container {
      overflow-x: auto;
      margin-bottom: 20px;
    }

    .fretboard {
      display: grid;
      grid-template-columns: 50px repeat(4, 120px);
      background: var(--fretboard-wood);
      border: 4px solid #1a0f0d;
      border-radius: 4px;
      position: relative;
      min-width: 530px;
    }

    .nut {
      background: #d7ccc8;
      border-right: 4px solid #8d6e63;
    }

    .fret {
      border-right: 3px solid var(--fret-wire);
      height: 180px;
      position: relative;
    }

    .strings-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      pointer-events: none;
    }

    .string {
      background: var(--string-color);
      width: 100%;
      box-shadow: 0 1px 2px rgba(0,0,0,0.8);
    }

    /* Varying string thicknesses */
    .string-5 { height: 4px; }
    .string-4 { height: 3.5px; }
    .string-3 { height: 3px; }
    .string-2 { height: 2.5px; }
    .string-1 { height: 2px; }
    .string-0 { height: 1.5px; }

    .interactive-grid {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: 50px repeat(4, 120px);
      grid-template-rows: repeat(6, 1fr);
    }

    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .note-marker {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--accent);
      color: #000;
      font-size: 12px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 8px rgba(255, 152, 0, 0.8);
    }

    .muted-marker {
      color: #ff5252;
      font-weight: bold;
      font-size: 18px;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 15px;
    }

    .strum-btn {
      background: #2e7d32;
      font-size: 18px;
      padding: 12px 30px;
    }

    .strum-btn:hover {
      background: #388e3c;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Guitar Chord Academy</h1>
    
    <div class="chord-selector" id="chord-buttons"></div>

    <div class="info-panel">
      <h3 id="chord-title" style="margin-top:0;">Select a Chord</h3>
      <p id="chord-desc">Click any chord above to view finger placements and listen to how it sounds.</p>
    </div>

    <div class="fretboard-container">
      <div class="fretboard">
        <div class="nut"></div>
        <div class="fret"></div>
        <div class="fret"></div>
        <div class="fret"></div>
        <div class="fret"></div>

        <div class="strings-layer">
          <div class="string string-5"></div>
          <div class="string string-4"></div>
          <div class="string string-3"></div>
          <div class="string string-2"></div>
          <div class="string string-1"></div>
          <div class="string string-0"></div>
        </div>

        <div class="interactive-grid" id="grid"></div>
      </div>
    </div>

    <div class="actions">
      <button class="strum-btn" onclick="strumCurrentChord()">Strum Chord</button>
    </div>
  </div>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    // Standard tuning frequencies: E2, A2, D3, G3, B3, E4
    const baseFreqs = [82.41, 110.00, 146.83, 196.00, 246.94, 329.63];
    const stringNames = ['E', 'A', 'D', 'G', 'B', 'E'];

    const chords = {
      'C': {
        name: 'C Major',
        frets: [-1, 3, 2, 0, 1, 0], // -1 = muted, 0 = open
        fingers: ['', '3', '2', 'O', '1', 'O'],
        desc: 'Place finger 1 on string 2 (fret 1), finger 2 on string 4 (fret 2), and finger 3 on string 5 (fret 3). Mute the low E string.'
      },
      'G': {
        name: 'G Major',
        frets: [3, 2, 0, 0, 0, 3],
        fingers: ['2', '1', 'O', 'O', 'O', '3'],
        desc: 'Place finger 1 on string 5 (fret 2), finger 2 on string 6 (fret 3), and finger 3 on string 1 (fret 3).'
      },
      'Am': {
        name: 'A Minor',
        frets: [-1, 0, 2, 2, 1, 0],
        fingers: ['', 'O', '2', '3', '1', 'O'],
        desc: 'Place finger 1 on string 2 (fret 1), finger 2 on string 4 (fret 2), and finger 3 on string 3 (fret 2). Mute low E.'
      },
      'Em': {
        name: 'E Minor',
        frets: [0, 2, 2, 0, 0, 0],
        fingers: ['O', '2', '3', 'O', 'O', 'O'],
        desc: 'Place finger 2 on string 5 (fret 2) and finger 3 on string 4 (fret 2). Strum all six strings.'
      },
      'D': {
        name: 'D Major',
        frets: [-1, -1, 0, 2, 3, 2],
        fingers: ['', '', 'O', '1', '3', '2'],
        desc: 'Place finger 1 on string 3 (fret 2), finger 2 on string 1 (fret 2), and finger 3 on string 2 (fret 3). Strum top 4 strings.'
      }
    };

    let activeChordKey = 'C';

    function init() {
      const btnContainer = document.getElementById('chord-buttons');
      Object.keys(chords).forEach(key => {
        const btn = document.createElement('button');
        btn.innerText = key;
        btn.onclick = () => selectChord(key);
        btn.id = `btn-${key}`;
        btnContainer.appendChild(btn);
      });

      renderGrid();
      selectChord('C');
    }

    function renderGrid() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      
      // 6 strings (E2 to E4), 5 columns (0=Nut/Open, 1-4=Frets)
      for (let stringIdx = 5; stringIdx >= 0; stringIdx--) {
        for (let fretIdx = 0; fretIdx <= 4; fretIdx++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.dataset.string = stringIdx;
          cell.dataset.fret = fretIdx;
          cell.onclick = () => playSingleNote(stringIdx, fretIdx);
          grid.appendChild(cell);
        }
      }
    }

    function selectChord(key) {
      activeChordKey = key;
      const chord = chords[key];

      document.querySelectorAll('.chord-selector button').forEach(b => b.classList.remove('active'));
      document.getElementById(`btn-${key}`).classList.add('active');

      document.getElementById('chord-title').innerText = chord.name;
      document.getElementById('chord-desc').innerText = chord.desc;

      // Clear existing markers
      document.querySelectorAll('.cell').forEach(c => c.innerHTML = '');

      // Place markers for active chord
      chord.frets.forEach((fret, stringIdx) => {
        // Map string index (0 = Low E, 5 = High E) to visual rows (inverted layout)
        const visualRow = 5 - stringIdx;
        const targetFret = fret === -1 ? 0 : fret;
        
        const cell = document.querySelector(`.cell[data-string="${stringIdx}"][data-fret="${targetFret}"]`);
        if (cell) {
          const marker = document.createElement('div');
          if (fret === -1) {
            marker.className = 'muted-marker';
            marker.innerText = 'X';
          } else {
            marker.className = 'note-marker';
            marker.innerText = chord.fingers[stringIdx];
          }
          cell.appendChild(marker);
        }
      });
    }

    function playNoteSound(stringIdx, fret) {
      if (fret === -1) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const freq = baseFreqs[stringIdx] * Math.pow(2, fret / 12);
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const filter = audioCtx.createBiquadFilter();

      // Plucked string synthesis simulation
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(1200, audioCtx.currentTime);
      filter.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 1.2);

      gain.gain.setValueAtTime(0.6, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 1.2);
    }

    function playSingleNote(stringIdx, fret) {
      const chordFret = chords[activeChordKey].frets[stringIdx];
      playNoteSound(stringIdx, chordFret);
    }

    function strumCurrentChord() {
      const frets = chords[activeChordKey].frets;
      frets.forEach((fret, stringIdx) => {
        if (fret !== -1) {
          setTimeout(() => {
            playNoteSound(stringIdx, fret);
          }, stringIdx * 40); // Slight delay for strum effect
        }
      });
    }

    window.onload = init;
  </script>
</body>
</html>
